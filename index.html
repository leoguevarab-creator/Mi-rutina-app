<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeRoutine Pro - Gestor de Hábitos</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4A90E2">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header>
            <h1>🌟 LifeRoutine Pro</h1>
            <div class="date-display"></div>
        </header>

        <!-- Navegación -->
        <nav class="bottom-nav">
            <button class="nav-btn active" data-view="daily">📅 Diario</button>
            <button class="nav-btn" data-view="weekly">📊 Semanal</button>
            <button class="nav-btn" data-view="monthly">📈 Mensual</button>
            <button class="nav-btn" data-view="challenges">🏆 Retos</button>
            <button class="nav-btn" data-view="stats">📊 Stats</button>
        </nav>

        <!-- Contenido Principal -->
        <main id="main-content">
            <!-- Vista Diaria -->
            <section id="daily-view" class="view active">
                <h2>Actividades de Hoy</h2>
                <div class="progress-bar">
                    <div class="progress-fill" id="daily-progress"></div>
                </div>
                
                <!-- Categorías -->
                <div class="categories">
                    <!-- Trabajo -->
                    <div class="category-card" data-category="work">
                        <h3>💼 Trabajo</h3>
                        <div class="activities" id="work-activities"></div>
                        <button class="add-activity-btn" onclick="addActivity('work')">+ Agregar</button>
                    </div>

                    <!-- Salud -->
                    <div class="category-card" data-category="health">
                        <h3>💪 Salud</h3>
                        <div class="activities" id="health-activities"></div>
                        <button class="add-activity-btn" onclick="addActivity('health')">+ Agregar</button>
                    </div>

                    <!-- Crecimiento Intelectual -->
                    <div class="category-card" data-category="intellectual">
                        <h3>🧠 Intelectual</h3>
                        <div class="activities" id="intellectual-activities"></div>
                        <button class="add-activity-btn" onclick="addActivity('intellectual')">+ Agregar</button>
                    </div>

                    <!-- Propósito de Vida -->
                    <div class="category-card" data-category="purpose">
                        <h3>🎯 Propósito</h3>
                        <div class="activities" id="purpose-activities"></div>
                        <button class="add-activity-btn" onclick="addActivity('purpose')">+ Agregar</button>
                    </div>
                </div>
            </section>

            <!-- Vista Semanal -->
            <section id="weekly-view" class="view">
                <h2>Resumen Semanal</h2>
                <div class="week-grid" id="week-grid"></div>
            </section>

            <!-- Vista Mensual -->
            <section id="monthly-view" class="view">
                <h2>Calendario Mensual</h2>
                <div class="calendar" id="calendar"></div>
            </section>

            <!-- Vista de Retos -->
            <section id="challenges-view" class="view">
                <h2>🏆 Retos Activos</h2>
                <div id="challenges-container"></div>
            </section>

            <!-- Vista de Estadísticas -->
            <section id="stats-view" class="view">
                <h2>Estadísticas</h2>
                <canvas id="statsChart"></canvas>
            </section>
        </main>
    </div>

    <!-- Modal para agregar actividades -->
    <div id="activity-modal" class="modal">
        <div class="modal-content">
            <h3>Nueva Actividad</h3>
            <form id="activity-form">
                <input type="hidden" id="activity-category">
                <input type="text" id="activity-name" placeholder="Nombre de la actividad" required>
                <input type="number" id="activity-target" placeholder="Meta diaria (ej: 100 flexiones)">
                <select id="activity-type">
                    <option value="boolean">✅ Completado/No completado</option>
                    <option value="counter">🔢 Contador (ej: páginas, flexiones)</option>
                    <option value="timer">⏱️ Tiempo (minutos)</option>
                </select>

                <!-- NEW: selector para vincular la actividad a un reto existente -->
                <label for="activity-challenge">Vincular a un reto (opcional)</label>
                <select id="activity-challenge">
                    <option value="">— Ninguno —</option>
                    <!-- Opciones pobladas dinámicamente por app.populateChallengeSelect(category) -->
                </select>

                <div class="sub-activities">
                    <h4>Sub-actividades (items)</h4>
                    <div id="sub-activities-list"></div>
                    <button type="button" onclick="addSubActivity()">+ Agregar Item</button>
                </div>
                <button type="submit" class="btn-primary">Guardar</button>
                <button type="button" class="btn-secondary" onclick="closeModal()">Cancelar</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
